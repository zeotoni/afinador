<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#040b17">
    <meta name="color-scheme" content="dark">

    <link rel="manifest" href="/manifest.json">

    <link rel="icon" type="image/svg+xml" href="/app/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/app/icons/favicon-96x96.png">
    <link rel="shortcut icon" href="/app/icons/favicon.ico" type="image/x-icon">

    <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Afination">

    <title>AFINATION</title>
    <link rel="stylesheet" href="./app/css/reset.css">
    <link rel="stylesheet" href="./app/css/style.css">
</head>


<body>
    <div class="app">
        <header class="header">
            <img class="header__logo" src="./app/images/logo.png" alt="Logo de um diapasão com uma palheta">
            <h1 class="header__title">AFINATION</h1>
        </header>

        <main class="main">
            <section class="indicator">
            </section>

            <section class="note">
            </section>

            <section class="controls">
                <button class="mic-button" id="micButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-mic preview-icon">
                        <path d="M12 19v3" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <rect x="9" y="2" width="6" height="13" rx="3" />
                    </svg>
                    <span id="micButtonLabel">Ativar microfone</span>
                </button>
            </section>
        </main>

    </div>
    <script type="module" src="./app/js/app.js"></script>
</body>

</html>
